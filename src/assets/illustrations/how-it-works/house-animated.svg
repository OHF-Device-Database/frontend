<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -128 120 166" class="hiw3" role="img" aria-label="An exploded view of a house: the roof and walls lift to show a foundation made of data points">
<style>
.hiw3{--ink:#1b1916;--paper:#f6f5f3;--accent:#2f86ff;--mute:#c4bfb5}
@media (prefers-color-scheme: dark){.hiw3{--ink:#e9e6df;--paper:#0f0f0f;--mute:#3f3c38}}
.hiw3 path{fill:var(--paper);stroke:var(--ink);stroke-width:1.15;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.hiw3 .ln{fill:none}
.hiw3 .dt{fill:var(--mute);stroke:none}
.hiw3 .on{fill:var(--accent);stroke:none;opacity:0;animation:hiw3-on 9s ease-in-out infinite}
@keyframes hiw3-on{0%,36%{opacity:0}44%,66%{opacity:1}74%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.hiw3 .walls{transform:translateY(-42px)}.hiw3 .roof{transform:translateY(-62px)}.hiw3 .on{animation:none;opacity:1}}
</style>
