<svg xmlns="http://www.w3.org/2000/svg" class="cd" viewBox="-15.51 -28.75 31.02 39.4" width="124.1" height="157.59" tabindex="0" role="img" aria-label="Smart button, Buttons, switches and controls. Hover to pull it apart."><style>.cd{--paper:#F6F5F3;--ink:#1B1916;--mute:#CFCAC1;--hole:#1B1916;--acc:rgba(255,255,255,.72);--accl:rgba(27,25,22,.4)}@media (prefers-color-scheme: dark){.cd{--paper:#0F0F0F;--ink:#E9E6DF;--mute:#3F3C38;--hole:#E9E6DF;--acc:rgba(255,255,255,.5);--accl:rgba(233,230,223,.45)}}.pf{fill:var(--paper);stroke:var(--ink)}.ln{fill:none;stroke:var(--ink)}.mute{fill:var(--mute)}.acu{fill:var(--paper);stroke:none}.acf{fill:var(--acc);stroke:var(--ink)}.ac{fill:var(--acc);stroke:var(--ink)}.hole{fill:var(--hole);stroke:var(--ink)}.acl{fill:none;stroke:var(--accl)}.ln2{fill:none;stroke:var(--ink);stroke-linecap:round}.dash{fill:none;stroke:var(--ink);stroke-dasharray:2 2}.txt{fill:var(--ink);stroke:none;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.02em}path,ellipse{stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}path.ln2{stroke-width:2.2px}.pt{transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}.pt.fade{opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),opacity .3s}svg:hover .pt,svg:focus .pt,.open .pt{transform:translate(var(--tx),var(--ty))}svg:hover .fade,svg:focus .fade,.open .fade{opacity:1;transition-delay:var(--d,0ms),.28s}.pt.fout{transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),opacity .25s}svg:hover .fout,svg:focus .fout,.open .fout{opacity:0}@media (prefers-reduced-motion: reduce){.pt{transition:none}}</style><g class="pt" data-part="base" style="--tx:0px;--ty:0px;--d:90ms"><path class="pf" d="M-11.02 -3L-11.51 0A11.51 6.65 0 0 0 11.51 0L11.02 -3Z"/><ellipse class="pf" cx="0" cy="-3" rx="11.02" ry="6.36"/></g><g class="pt fade" data-part="battery" style="--tx:0px;--ty:-8px;--d:45ms"><path class="pf" d="M-6.12 -2.2L-6