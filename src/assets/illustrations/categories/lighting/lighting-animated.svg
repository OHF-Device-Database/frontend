<svg xmlns="http://www.w3.org/2000/svg" class="cd" viewBox="-19.43 -72.08 38.86 78" width="155.45" height="312.02" tabindex="0" role="img" aria-label="Smart bulb, Lighting. Hover to pull it apart."><style>.cd{--paper:#F6F5F3;--ink:#1B1916;--mute:#CFCAC1;--hole:#1B1916;--acc:rgba(255,255,255,.72);--accl:rgba(27,25,22,.4)}@media (prefers-color-scheme: dark){.cd{--paper:#0F0F0F;--ink:#E9E6DF;--mute:#3F3C38;--hole:#E9E6DF;--acc:rgba(255,255,255,.5);--accl:rgba(233,230,223,.45)}}.pf{fill:var(--paper);stroke:var(--ink)}.ln{fill:none;stroke:var(--ink)}.mute{fill:var(--mute)}.acu{fill:var(--paper);stroke:none}.acf{fill:var(--acc);stroke:var(--ink)}.ac{fill:var(--acc);stroke:var(--ink)}.hole{fill:var(--hole);stroke:var(--ink)}.acl{fill:none;stroke:var(--accl)}.ln2{fill:none;stroke:var(--ink);stroke-linecap:round}.dash{fill:none;stroke:var(--ink);stroke-dasharray:2 2}.txt{fill:var(--ink);stroke:none;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.02em}path,ellipse{stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}path.ln2{stroke-width:2.2px}.pt{transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}.pt.fade{opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),opacity .3s}svg:hover .pt,svg:focus .pt,.open .pt{transform:translate(var(--tx),var(--ty))}svg:hover .fade,svg:focus .fade,.open .fade{opacity:1;transition-delay:var(--d,0ms),.28s}.pt.fout{transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),opacity .25s}svg:hover .fout,svg:focus .fout,.open .fout{opacity:0}@media (prefers-reduced-motion: reduce){.pt{transition:none}}</style><g class="pt" data-part="base" style="--tx:0px;--ty:0px;--d:90ms"><path class="pf" d="M-3.18 -2.6L-3.18 0A3.18 1.84 0 0 0 3.18 0L3.18 -2.6Z"/><ellipse class="pf" cx="0" cy="-2.6" rx="3.18" ry="1.84"/><path class="pf" d="M-7.84 -13.6L-7.84 -2.6A7.84 4.53 0 0 0 7.84 -2.6L7.84 -13.6Z"/><ellipse class="pf" cx="0" cy="-13.6" rx="7.84" ry="4.