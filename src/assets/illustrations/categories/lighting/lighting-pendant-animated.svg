<svg xmlns="http://www.w3.org/2000/svg" class="cd" viewBox="-22.37 -66.84 44.74 81.88" width="178.96" height="327.5" tabindex="0" role="img" aria-label="Pendant lamp, Lighting. Hover to pull it apart."><style>.cd{--paper:#F6F5F3;--ink:#1B1916;--mute:#CFCAC1;--hole:#1B1916;--acc:rgba(255,255,255,.72);--accl:rgba(27,25,22,.4)}@media (prefers-color-scheme: dark){.cd{--paper:#0F0F0F;--ink:#E9E6DF;--mute:#3F3C38;--hole:#E9E6DF;--acc:rgba(255,255,255,.5);--accl:rgba(233,230,223,.45)}}.pf{fill:var(--paper);stroke:var(--ink)}.ln{fill:none;stroke:var(--ink)}.mute{fill:var(--mute)}.acu{fill:var(--paper);stroke:none}.acf{fill:var(--acc);stroke:var(--ink)}.ac{fill:var(--acc);stroke:var(--ink)}.hole{fill:var(--hole);stroke:var(--ink)}.acl{fill:none;stroke:var(--accl)}.ln2{fill:none;stroke:var(--ink);stroke-linecap:round}.dash{fill:none;stroke:var(--ink);stroke-dasharray:2 2}.txt{fill:var(--ink);stroke:none;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.02em}path,ellipse{stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}path.ln2{stroke-width:2.2px}.pt{transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}.pt.fade{opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),opacity .3s}svg:hover .pt,svg:focus .pt,.open .pt{transform:translate(var(--tx),var(--ty))}svg:hover .fade,svg:focus .fade,.open .fade{opacity:1;transition-delay:var(--d,0ms),.28s}.pt.fout{transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),opacity .25s}svg:hover .fout,svg:focus .fout,.open .fout{opacity:0}@media (prefers-reduced-motion: reduce){.pt{transition:none}}</style><g class="pt" data-part="canopy" style="--tx:0px;--ty:-6px;--d:45ms"><path class="pf" d="M0.5 -26.5L0.5 -50.5L-0.5 -50.5L-0.5 -26.5Z"/><path class="pf" d="M-7.35 -52.6L-7.35 -50A7.35 4.24 0 0 0 7.35 -50L7.35 -52.6Z"/><ellipse class="pf" cx="0" cy="-52.6" rx="7.35" ry="4.24"/></g><g class="pt fade" data-part="bulb" style="--tx:0px;--ty:12px;--d:0ms"><ellipse class="pf" cx="0" cy="-6.6" rx="5.63" ry="5.63"/><path class="pf" d="M-2.94 -14L-2.94 -10A2.94 1.7 0 0 0 2.94 -10L2.94 -14Z"/><ellipse class="pf" cx="0" cy="-14" rx="2.94" ry="1.7"/></g><g class="pt" data-part="shade" style="--tx:0px;--ty:0px;--d:90ms"><path class="pf" d="M-4.16 -24L-18.37 -10A18.37 10.61 0 0 0 18.37 -10L4.16 -24Z"/><ellipse class="pf" cx="0" cy="-24" rx="4.16" ry="2.4"/></g></svg>