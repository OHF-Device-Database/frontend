<svg xmlns="http://www.w3.org/2000/svg" class="cd" viewBox="-32.17 -36.64 64.34 69.75" width="257.34" height="279.01" tabindex="0" role="img" aria-label="Pool sensor, Pool and spa. Hover to pull it apart."><style>.cd{--paper:#F6F5F3;--ink:#1B1916;--mute:#CFCAC1;--hole:#1B1916;--acc:rgba(255,255,255,.72);--accl:rgba(27,25,22,.4)}@media (prefers-color-scheme: dark){.cd{--paper:#0F0F0F;--ink:#E9E6DF;--mute:#3F3C38;--hole:#E9E6DF;--acc:rgba(255,255,255,.5);--accl:rgba(233,230,223,.45)}}.pf{fill:var(--paper);stroke:var(--ink)}.ln{fill:none;stroke:var(--ink)}.mute{fill:var(--mute)}.acu{fill:var(--paper);stroke:none}.acf{fill:var(--acc);stroke:var(--ink)}.ac{fill:var(--acc);stroke:var(--ink)}.hole{fill:var(--hole);stroke:var(--ink)}.acl{fill:none;stroke:var(--accl)}.ln2{fill:none;stroke:var(--ink);stroke-linecap:round}.dash{fill:none;stroke:var(--ink);stroke-dasharray:2 2}.txt{fill:var(--ink);stroke:none;font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.02em}path,ellipse{stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}path.ln2{stroke-width:2.2px}.pt{transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}.pt.fade{opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),opacity .3s}svg:hover .pt,svg:focus .pt,.open .pt{transform:translate(var(--tx),var(--ty))}svg:hover .fade,svg:focus .fade,.open .fade{opacity:1;transition-delay:var(--d,0ms),.28s}.pt.fout{transition:transform .9s cubic-bezier(.2,.7,.2,1) var(--d,0ms),opacity .25s}svg:hover .fout,svg:focus .fout,.open .fout{opacity:0}@media (prefers-reduced-motion: reduce){.pt{transition:none}}</style><g class="pt fade" data-part="probe" style="--tx:0px;--ty:14px;--d:0ms"><path class="pf" d="M-5.39 0L-5.39 12A5.39 3.11 0 0 0 5.39 12L5.39 0Z"/><ellipse class="pf" cx="0" cy="0" rx="5.39" ry="3.11"/><ellipse class="ln" cx="0" cy="10.4" rx="0.98" ry="0.57"/><ellipse class="ln" cx="0" cy="13.6" rx="0.98" ry="0.57"/></g><g class="pt fout" data-part="under water" style="--tx:0px;--ty:0px;--d:90ms"><path class="dash" d="M-5.39 0L-5.39 12A5.39 3.11 0 0 0 5.39 12L5.39 0"/></g><g class="pt" data-part="water" style="--tx:0px;--ty:0px;--d:135ms"><ellipse class="acl" cx="0" cy="-1.5" rx="20.82" ry="12.02"/><ellipse class="acl" cx="0" cy="-1.5" rx="28.17" ry="16.26"/></g><g class="pt" data-part="float" style="--tx:0px;--ty:0px;--d:180ms"><path class="pf" d="M-14.7 -7.5L-15.19 0A15.19 8.77 0 0 0 15.19 0L14.7 -7.5Z"/><ellipse class="pf" cx="0" cy="-7.5" rx="14.7" ry="8.49"/></g><g class="pt" data-part="top" style="--tx:0px;--ty:-14px;--d:45ms"><path class="pf" d="M-14.7 -9.5L-14.7 -7.5A14.7 8.49 0 0 0 14.7 -7.5L14.7 -9.5Z"/><path class="pf" d="M-14.7 -9.5A14.7 9.14 0 0 1 14.7 -9.5A14.7 8.49 0 0 1 -14.7 -9.5Z"/><ellipse class="ln" cx="0" cy="-12.6" rx="3.92" ry="2.26"/></g></svg>